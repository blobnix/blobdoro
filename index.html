<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blobdoro</title>
    <link rel="stylesheet" href="/style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="/assets/blobdoro.png">
  </head>
  <body>
    <div class="background"></div>
    <main>
      <div class="title">
        <p>blobdoro</p>
        <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="32" height="32" viewBox="0,0,256,256" id="setting">
          <g fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="none" font-weight="none" font-size="none" text-anchor="none" style="mix-blend-mode: normal">
            <g transform="scale(5.12,5.12)">
              <path d="M40.843,22.134c0.668,0.115 1.157,0.695 1.157,1.373v2.985c0,0.678 -0.489,1.258 -1.157,1.373l-2.777,0.478c-0.321,1.258 -0.816,2.443 -1.462,3.531l1.626,2.301c0.391,0.554 0.327,1.31 -0.153,1.789l-2.111,2.111c-0.538,0.517 -1.277,0.521 -1.789,0.153l-2.301,-1.626c-1.088,0.646 -2.273,1.141 -3.531,1.462l-0.478,2.777c-0.116,0.67 -0.696,1.159 -1.375,1.159h-2.985c-0.678,0 -1.258,-0.489 -1.373,-1.157l-0.478,-2.777c-1.258,-0.321 -2.443,-0.816 -3.531,-1.462l-2.301,1.626c-0.534,0.381 -1.283,0.343 -1.789,-0.153l-2.111,-2.111c-0.48,-0.48 -0.544,-1.235 -0.153,-1.789l1.626,-2.301c-0.646,-1.088 -1.141,-2.273 -1.462,-3.531l-2.777,-0.478c-0.669,-0.116 -1.158,-0.696 -1.158,-1.375v-2.985c0,-0.678 0.489,-1.258 1.157,-1.373l2.777,-0.478c0.321,-1.258 0.816,-2.443 1.462,-3.531l-1.626,-2.301c-0.391,-0.554 -0.327,-1.31 0.153,-1.789l2.111,-2.111c0.596,-0.579 1.369,-0.456 1.789,-0.153l2.301,1.626c1.088,-0.646 2.273,-1.141 3.531,-1.462l0.478,-2.777c0.116,-0.669 0.696,-1.158 1.375,-1.158h2.985c0.678,0 1.258,0.489 1.373,1.157l0.478,2.777c1.258,0.321 2.443,0.816 3.531,1.462l2.301,-1.626c0.617,-0.414 1.351,-0.282 1.789,0.153l2.111,2.111c0.48,0.48 0.544,1.235 0.153,1.789l-1.626,2.301c0.646,1.088 1.141,2.273 1.462,3.531zM25,31.955c3.841,0 6.955,-3.114 6.955,-6.955c0,-3.841 -3.114,-6.955 -6.955,-6.955c-3.841,0 -6.955,3.114 -6.955,6.955c0,3.841 3.114,6.955 6.955,6.955z"></path>
            </g>
          </g>
        </svg>
      </div>
      <div>
        <div class="overlay" id="settings-overlay" style="display: none;">
          <div class="setting-card">
            <div class="settings-header">
              <div>
                <h2>Settings</h2>
                <p>Customize your focus sessions</p>
              </div>
              <button class="close-settings" id="close-settings">×</button>
            </div>
            <div class="settings-section">
              <p class="section-title">Timer</p>
              <div class="timer-inputs">
                <label>
                  <span>Focus</span>
                  <input type="number" min="1" max="99" value="25" id="work-time" required>
                  <small>min</small>
                </label>
                <label>
                  <span>Break</span>
                  <input type="number" min="1" max="99" value="5" id="break-time" required>
                  <small>min</small>
                </label>
                <label>
                  <span>Long break</span>
                  <input type="number" min="1" max="99" value="15" id="longbreak-time" required>
                  <small>min</small>
                </label>
              </div>
            </div>
            <div class="settings-section">
              <p class="section-title">Preferences</p>
              <label class="setting-row">
                <div>
                  <span>Auto Break</span>
                  <small>Start the break automatically</small>
                </div>
                <input type="checkbox" id="auto-break">
              </label>
              <label class="setting-row">
                <div>
                  <span>Music</span>
                  <small>Play music during sessions</small>
                </div>
                <input type="checkbox" id="music" checked>
              </label>
            </div>
            <button class="save-settings" id="save-settings">Save changes</button>
          </div>
        </div>
        <div class="timer-card">
          <p id="work-session">Focus Session</p>
          <p id="break-session" style="display: none;">Break Session</p>
          <p id="longbreak-session" style="display: none;">Long Break Session</p>
          <h1 id="timer-display">25:00</h1>
          <div class="session-dots" id="session-dots" role="img" aria-label="0 of 4 work sessions complete">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </div>
          <div>
            <button id="start">Start</button>
            <button id="pause" style="display: none;">Pause</button>
            <button id="reset">Reset</button>
            <button id="skip">Skip</button>
            <button id="picture-in-picture" aria-label="Picture in picture" title="Picture in picture">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2" />
                <rect x="13" y="12" width="6" height="5" rx="1" />
              </svg>
            </button>
            <br>
            <br>
          </div>
    </main>
  </body>
</html>
